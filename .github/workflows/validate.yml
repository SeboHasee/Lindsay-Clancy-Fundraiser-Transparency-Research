name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy jsonschema
      - run: ruff check .
      - run: mypy src research --ignore-missing-imports
      - run: python -m compileall src research
      - run: python -m research validate
      - name: Schema and docs presence check
        run: |
          test -f data/schema/donation.schema.json
          test -f docs/architecture.md
          test -f docs/automation.md
          test -f docs/community-research.md
          test -f docs/maintenance.md
      - run: pytest -q
