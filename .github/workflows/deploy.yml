name: Deploy Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m research setup
      - run: python -m research validate
      - run: python -m research analyze
      - run: python -m research status
      - run: python -m research report
      - name: Build Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp -r reports/* site/
          cp status/system-status.json site/system-status.json
          cp reports/dashboard.html site/index.html
      - name: Verify required artifacts
        run: |
          test -f site/index.html
          test -f site/system-status.json
          test -f site/fundraiser-overview.html
          test -f site/donation-statistics.html
          test -f site/coverage.html
          test -f site/data-quality.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
