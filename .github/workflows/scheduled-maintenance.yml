name: Scheduled Maintenance
on:
  schedule:
    - cron: '45 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m research setup
      - run: python -m research triage
      - run: python -m research status
      - name: Open parser/source review issue when queue has items
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/review/queue.json';
            if (!fs.existsSync(path)) return;
            const queue = JSON.parse(fs.readFileSync(path, 'utf8'));
            const openItems = queue.filter(x => ['NEW','UNDER_REVIEW'].includes(x.status));
            if (openItems.length === 0) return;
            const title = `[Automation] Review queue has ${openItems.length} pending item(s)`;
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.find(i => i.title.startsWith('[Automation] Review queue has'));
            const body = 'Automated maintenance detected review-required items in data/review/queue.json.';
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, title, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['automation','review-required']});
            }
