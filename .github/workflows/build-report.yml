name: Build Report
on:
  workflow_dispatch:
  push:
    branches: [main, master, copilot/**]
permissions:
  contents: read
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m research validate
      - run: python -m research analyze
      - run: python -m research report
