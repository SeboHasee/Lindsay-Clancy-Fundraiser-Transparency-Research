name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release artifact bundle
        run: |
          tar -czf reports-bundle.tgz reports data/public || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: v0.1.0
          body: Automated release with latest approved public research artifacts.
          files: reports-bundle.tgz
