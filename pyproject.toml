[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lindsay-clancy-fundraiser-research"
version = "0.1.0"
description = "Evidence-first fundraiser transparency research system"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["research", "src", "src.collectors", "src.verification", "src.analysis", "src.database", "src.validation", "src.publication", "src.cli", "src.sources", "src.monitoring"]
